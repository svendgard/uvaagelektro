# Render Blueprint (dokumentasjon av oppsettet). Alt i Frankfurt.
services:
  - type: web
    name: uvaagelektro
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TENANT_ID
        value: uvaag-elektro
      - key: BOOTSTRAP_SUPERADMIN_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: uvaagelektro-db
          property: connectionString
databases:
  - name: uvaagelektro-db
    region: frankfurt
    plan: basic-256mb
